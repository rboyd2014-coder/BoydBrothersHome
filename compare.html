<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Boyd Survey Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f1ea; --card:#fffdf9; --ink:#2a2420; --muted:#76695e; --line:#e4d9cc;
         --brick:#a4432e; --brick-soft:#f3e2da; --ok:#3f7a4f; --ok-soft:#e3efe5; --amber:#9a6a12; --amber-soft:#f6ecd6; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1816; --card:#262120; --ink:#f1e9e1; --muted:#b3a597; --line:#3a322e;
           --brick:#e0785d; --brick-soft:#3a2721; --ok:#7fbf8e; --ok-soft:#20302a; --amber:#e0b35a; --amber-soft:#352c1b; }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 60px}
  header{padding:40px 0 16px}
  .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brick);font-weight:600}
  h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,5vw,38px);margin:6px 0 8px;line-height:1.1}
  h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:28px 0 8px}
  .lede{color:var(--muted);margin:0}
  .loaders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
  .drop{display:block;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:18px;cursor:pointer;text-align:center}
  .drop.ok{border-style:solid;border-color:var(--ok)}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0 0}
  .sheet strong{display:block;margin-bottom:8px}
  .sheet-row{display:flex;gap:10px;flex-wrap:wrap}
  .sheet input{flex:1;min-width:180px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .sheet-msg{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
  .or{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 -6px}
  .drop input{display:none}
  .drop strong{display:block}
  .drop span{color:var(--muted);font-size:14px}
  .summary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 4px}
  .chip{font-size:14px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{text-align:left;vertical-align:top;padding:12px 14px;border-top:1px solid var(--line);font-size:15px}
  thead th{border-top:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  td.qcell{width:34%;font-weight:600}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px}
  .t-match{background:var(--ok-soft);color:var(--ok)}
  .t-close{background:var(--amber-soft);color:var(--amber)}
  .t-diff{background:var(--brick-soft);color:var(--brick)}
  .t-talk{background:var(--amber-soft);color:var(--amber)}
  .common{font-size:13px;color:var(--muted);margin-top:4px}
  .blank{color:var(--muted);font-style:italic}
  .qn{color:var(--muted);font-weight:500;margin-right:4px}
  .mini{margin:0;padding:0;list-style:none;font-size:14px}
  .mini li{padding:1px 0}
  .mini li.hot{color:var(--brick);font-weight:600}
  .ts{font-size:13px;color:var(--muted);margin-top:14px}
  @media print{ .loaders,.summary,.actions{display:none} body{background:#fff} }
  .actions{margin:20px 0}
  button{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  a{color:var(--brick)}
  @media (max-width:640px){
    .loaders{grid-template-columns:1fr}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border-top:1px solid var(--line)} td{border-top:0;padding:8px 14px}
    td.qcell{width:100%;padding-top:14px}
    td[data-who]::before{content:attr(data-who);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">1017 · Bellwood</div>
    <h1>Where we line up.</h1>
    <p class="lede">Load both answer files. Everything stays in this browser — nothing is uploaded. <a href="index.html">Back to the survey</a></p>
  </header>

  <div class="sheet" id="sheetBox" hidden>
    <strong>Load both answers from our Google Sheet</strong>
    <div class="sheet-row">
      <input type="password" id="passcode" placeholder="Passcode" autocomplete="current-password">
      <button id="loadSheet">Load answers</button>
    </div>
    <div class="sheet-msg" id="sheetMsg"></div>
  </div>
  <p class="or" id="orLine" hidden>or load answer files</p>
  <div class="loaders">
    <label class="drop" id="dropA"><input type="file" accept=".json,application/json" data-slot="0"><strong>First person’s file</strong><span>Tap to choose a .json</span></label>
    <label class="drop" id="dropB"><input type="file" accept=".json,application/json" data-slot="1"><strong>Second person’s file</strong><span>Tap to choose a .json</span></label>
  </div>

  <div id="out"></div>
</div>

<script src="config.js"></script>
<script>
const CONFIG = window.SURVEY_CONFIG || { SHEET_ENDPOINT: "" };
const files = [null, null];
let filter = 'all';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.querySelectorAll('input[type=file]').forEach(inp => inp.addEventListener('change', async () => {
  const f = inp.files[0]; if (!f) return;
  const slot = +inp.dataset.slot;
  const drop = inp.parentElement;
  try{
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.answers)) throw new Error('not a survey file');
    files[slot] = data;
    drop.classList.add('ok');
    drop.querySelector('strong').textContent = data.respondent || f.name;
    drop.querySelector('span').textContent = 'Loaded \u2014 tap to replace';
  }catch(e){
    files[slot] = null; drop.classList.remove('ok');
    drop.querySelector('span').textContent = 'That doesn\u2019t look like a survey answers file.';
  }
  draw();
}));

function markLoaded(slot, data){
  const drop = document.getElementById(slot ? 'dropB' : 'dropA');
  drop.classList.add('ok');
  drop.querySelector('strong').textContent = data.respondent || 'Loaded';
  drop.querySelector('span').textContent = 'Loaded — tap to replace';
}
if (CONFIG.SHEET_ENDPOINT){
  document.getElementById('sheetBox').hidden = false;
  document.getElementById('orLine').hidden = false;
  const msg = document.getElementById('sheetMsg');
  const run = async () => {
    const key = document.getElementById('passcode').value.trim();
    if (!key){ msg.textContent = 'Enter the passcode first.'; return; }
    msg.textContent = 'Loading…';
    try{
      const res = await fetch(CONFIG.SHEET_ENDPOINT + '?key=' + encodeURIComponent(key));
      const data = await res.json();
      if (!data.ok){ msg.textContent = data.error || 'Couldn’t load answers.'; return; }
      const rs = (data.responses || []).sort((x,y) => new Date(y.submitted_at) - new Date(x.submitted_at));
      if (rs.length < 2){ msg.textContent = rs.length ? `Only ${rs[0].respondent} has submitted so far.` : 'No one has submitted yet.'; return; }
      if (rs.length > 2) msg.textContent = `Found ${rs.length} names in the sheet — showing the two most recent: ${rs[0].respondent} and ${rs[1].respondent}.`;
      else msg.textContent = `Loaded ${rs[0].respondent} and ${rs[1].respondent}.`;
      const pair = rs.slice(0,2).sort((x,y) => x.respondent.localeCompare(y.respondent));
      files[0] = pair[0]; files[1] = pair[1];
      markLoaded(0, pair[0]); markLoaded(1, pair[1]);
      draw();
    }catch(e){ msg.textContent = 'Couldn’t reach the sheet. Check your connection, or load answer files below.'; }
  };
  document.getElementById('loadSheet').onclick = run;
  document.getElementById('passcode').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}

const isEmpty = a => !a || a.value == null || (Array.isArray(a.value) ? a.value.length === 0 : typeof a.value === 'object' ? Object.keys(a.value).length === 0 : String(a.value).trim() === '');
const norm = x => (x || '').trim().toLowerCase();

function status(q, a, b){
  if (isEmpty(a) && isEmpty(b)) return {k:'skip'};
  if (isEmpty(a) || isEmpty(b)) return {k:'talk', label:'Only one answered'};
  if (q.type === 'text' || q.type === 'textarea') return {k:'talk', label:'Read & discuss'};
  if (q.type === 'scale'){
    const d = Math.abs(+a.value - +b.value);
    return d === 0 ? {k:'match', label:'Match'} : d === 1 ? {k:'close', label:'Close'} : {k:'diff', label:`${d}-point gap`};
  }
  if (q.type === 'grid'){
    const rows = q.rows || Object.keys({...a.value, ...b.value});
    const hot = rows.filter(r => a.value[r] != null && b.value[r] != null && Math.abs(a.value[r] - b.value[r]) >= 2);
    const exact = rows.every(r => a.value[r] === b.value[r]);
    if (exact) return {k:'match', label:'Match'};
    return hot.length ? {k:'diff', label:`Gaps on ${hot.length} item${hot.length>1?'s':''}`, hot} : {k:'close', label:'Close'};
  }
  if (q.type === 'rank'){
    const A = a.value, B = b.value;
    const hot = A.filter(x => B.includes(x) && Math.abs(A.indexOf(x) - B.indexOf(x)) >= 3);
    if (A.join('|') === B.join('|')) return {k:'match', label:'Same order'};
    if (A[0] === B[0] && !hot.length) return {k:'close', label:'Same #1'};
    return {k:'diff', label: A[0] === B[0] ? 'Same #1, big swings below' : 'Different priorities', hot};
  }
  if (q.type === 'checkbox'){
    const A = new Set(a.value), B = new Set(b.value);
    const common = [...A].filter(x => B.has(x) && x !== '__other');
    const sameOther = !A.has('__other') || norm(a.other) === norm(b.other);
    const same = A.size === B.size && [...A].every(x => B.has(x)) && sameOther;
    if (same) return {k:'match', label:'Match'};
    return common.length ? {k:'close', label:'Some overlap', common} : {k:'diff', label:'No overlap'};
  }
  const same = a.value === b.value && (a.value !== '__other' || norm(a.other) === norm(b.other));
  if (same) return {k:'match', label:'Match'};
  const flexible = v => /^(no preference|unsure|not sure|either is fine|neutral|too early|depends|it varies|doesn’t matter)/i.test(v);
  if (flexible(a.value) || flexible(b.value)) return {k:'close', label:'One of you is flexible'};
  return {k:'diff', label:'Different'};
}

function cellHTML(q, x, s){
  if (isEmpty(x)) return '<span class="blank">skipped</span>';
  const hot = new Set(s.hot || []);
  if (q.type === 'grid'){
    const rows = q.rows || Object.keys(x.value);
    return '<ul class="mini">' + rows.map(r => `<li class="${hot.has(r)?'hot':''}">${esc(r)}: <b>${x.value[r] ?? '–'}</b></li>`).join('') + '</ul>';
  }
  if (q.type === 'rank'){
    return '<ol class="mini">' + x.value.map((r,i) => `<li class="${hot.has(r)?'hot':''}">${i+1}. ${esc(r)}</li>`).join('') + '</ol>';
  }
  if (q.type === 'scale') return `<b>${esc(x.value)}</b>/5`;
  return esc(x.answer);
}
const tagClass = {match:'t-match', close:'t-close', diff:'t-diff', talk:'t-talk'};

function draw(){
  const out = document.getElementById('out');
  const [A, B] = files;
  if (!A || !B){ out.innerHTML = ''; return; }
  const bMap = Object.fromEntries(B.answers.map(x => [x.id, x]));
  const order = [...A.answers, ...B.answers.filter(x => !A.answers.some(y => y.id === x.id))];
  const rows = order.map(q => {
    const a = A.answers.find(x => x.id === q.id), b = bMap[q.id];
    return { q, a, b, s: status(q, a, b) };
  }).filter(r => r.s.k !== 'skip');

  const counts = { match:0, close:0, diff:0, talk:0 };
  rows.forEach(r => counts[r.s.k]++);
  const shown = rows.filter(r => filter === 'all' ? true : filter === 'gaps' ? (r.s.k === 'diff' || r.s.k === 'close') : r.s.k === filter);

  let html = `
    <div class="summary">
      <button class="chip" data-f="all" aria-pressed="${filter==='all'}">All (${rows.length})</button>
      <button class="chip" data-f="match" aria-pressed="${filter==='match'}">Aligned (${counts.match})</button>
      <button class="chip" data-f="gaps" aria-pressed="${filter==='gaps'}">Gaps (${counts.diff + counts.close})</button>
      <button class="chip" data-f="talk" aria-pressed="${filter==='talk'}">To discuss (${counts.talk})</button>
    </div>`;
  let lastSec = '';
  let table = '';
  const flush = () => { if (table){ html += `<table><thead><tr><th>Question</th><th>${esc(A.respondent)}</th><th>${esc(B.respondent)}</th></tr></thead><tbody>${table}</tbody></table>`; table=''; } };
  shown.forEach(r => {
    if (r.q.section !== lastSec){ flush(); html += `<h2>${esc(r.q.section)}</h2>`; lastSec = r.q.section; }
    const common = r.s.common && r.s.common.length ? `<div class="common">Both picked: ${esc(r.s.common.join(', '))}</div>` : '';
    table += `<tr>
      <td class="qcell">${r.q.num ? `<span class="qn">${r.q.num}.</span>` : ''}${esc(r.q.question)}<br><span class="tag ${tagClass[r.s.k]}">${esc(r.s.label)}</span>${common}</td>
      <td data-who="${esc(A.respondent)}">${cellHTML(r.q, r.a, r.s)}</td>
      <td data-who="${esc(B.respondent)}">${cellHTML(r.q, r.b, r.s)}</td></tr>`;
  });
  flush();
  if (!shown.length) html += '<p class="lede" style="margin-top:16px">Nothing in this view.</p>';
  html += `<p class="ts">${esc(A.respondent)}: ${new Date(A.submitted_at).toLocaleString()} · ${esc(B.respondent)}: ${new Date(B.submitted_at).toLocaleString()}</p>`;
  html += `<div class="actions"><button id="print">Print / save as PDF</button></div>`;
  out.innerHTML = html;
  out.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
  document.getElementById('print').onclick = () => window.print();
}
</script>
</body>
</html>
